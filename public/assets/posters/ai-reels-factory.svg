<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5a7ba6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5a7ba6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6decc" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e6decc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101622"/>
      <stop offset="1" stop-color="#0a0e16"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ab1d1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9ab1d1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9ab1d1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipL"><rect x="345" y="195" width="170" height="300" rx="20"/></clipPath>
    <clipPath id="clipC"><rect x="545" y="160" width="190" height="340" rx="22"/></clipPath>
    <clipPath id="clipR"><rect x="765" y="195" width="170" height="300" rx="20"/></clipPath>
    <style>
      .rise { animation: rise 7s ease-in-out infinite; }
      .rise2 { animation: rise 9s ease-in-out infinite reverse; }
      @keyframes rise { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-24px); } }
      .scanline { animation: scan 3.6s linear infinite; }
      @keyframes scan { from { transform: translateY(-340px); } to { transform: translateY(340px); } }
      .bar { animation: eq 1.4s ease-in-out infinite; transform-origin: center bottom; transform-box: fill-box; }
      @keyframes eq { 0%,100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0%,100% { opacity: 0.85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0 120H1280M0 240H1280M0 360H1280M0 480H1280M0 600H1280"/>
    <path d="M160 0V720M320 0V720M480 0V720M640 0V720M800 0V720M960 0V720M1120 0V720"/>
  </g>

  <!-- aurora glows -->
  <circle class="rise" cx="280" cy="170" r="260" fill="url(#glowBlue)"/>
  <circle class="rise2" cx="1030" cy="560" r="300" fill="url(#glowBlue)"/>
  <circle class="rise2" cx="900" cy="160" r="180" fill="url(#glowWarm)"/>

  <!-- header -->
  <text x="80" y="92" fill="#f5f6f8" font-size="30" font-weight="700" letter-spacing="6">AI REELS FACTORY</text>
  <text x="80" y="124" fill="#8a93a3" font-size="15" letter-spacing="3">BRIEF → CLAUDE → HIGGSFIELD → ELEVENLABS → FFMPEG</text>

  <!-- left frame -->
  <g>
    <rect x="345" y="195" width="170" height="300" rx="20" fill="url(#frameFill)" stroke="#ffffff" stroke-opacity="0.14"/>
    <g clip-path="url(#clipL)">
      <rect class="scanline" x="345" y="195" width="170" height="300" fill="url(#scan)"/>
    </g>
    <text x="430" y="470" fill="#8a93a3" font-size="12" text-anchor="middle" letter-spacing="2">CLIP_01</text>
  </g>

  <!-- center frame (hero) -->
  <g>
    <rect x="545" y="160" width="190" height="340" rx="22" fill="url(#frameFill)" stroke="#9ab1d1" stroke-opacity="0.55"/>
    <g clip-path="url(#clipC)">
      <rect class="scanline" x="545" y="160" width="190" height="340" fill="url(#scan)"/>
    </g>
    <circle class="pulse" cx="640" cy="318" r="40" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.4"/>
    <path d="M628 298 L662 318 L628 338 Z" fill="#f5f6f8"/>
    <text x="640" y="476" fill="#bcd3f7" font-size="12" text-anchor="middle" letter-spacing="2">1080 × 1920 · 24 FPS</text>
  </g>

  <!-- right frame -->
  <g>
    <rect x="765" y="195" width="170" height="300" rx="20" fill="url(#frameFill)" stroke="#ffffff" stroke-opacity="0.14"/>
    <g clip-path="url(#clipR)">
      <rect class="scanline" x="765" y="195" width="170" height="300" fill="url(#scan)"/>
    </g>
    <text x="850" y="470" fill="#8a93a3" font-size="12" text-anchor="middle" letter-spacing="2">CLIP_03</text>
  </g>

  <!-- waveform -->
  <g fill="#9ab1d1">
    <rect class="bar" style="animation-delay:0s"    x="480" y="560" width="10" height="64" rx="5" />
    <rect class="bar" style="animation-delay:.15s"  x="504" y="560" width="10" height="64" rx="5" />
    <rect class="bar" style="animation-delay:.3s"   x="528" y="560" width="10" height="64" rx="5" fill="#bdcce3"/>
    <rect class="bar" style="animation-delay:.45s"  x="552" y="560" width="10" height="64" rx="5" />
    <rect class="bar" style="animation-delay:.6s"   x="576" y="560" width="10" height="64" rx="5" fill="#bdcce3"/>
    <rect class="bar" style="animation-delay:.75s"  x="600" y="560" width="10" height="64" rx="5" />
    <rect class="bar" style="animation-delay:.9s"   x="624" y="560" width="10" height="64" rx="5" fill="#e6decc"/>
    <rect class="bar" style="animation-delay:1.05s" x="648" y="560" width="10" height="64" rx="5" />
    <rect class="bar" style="animation-delay:.9s"   x="672" y="560" width="10" height="64" rx="5" fill="#bdcce3"/>
    <rect class="bar" style="animation-delay:.75s"  x="696" y="560" width="10" height="64" rx="5" />
    <rect class="bar" style="animation-delay:.6s"   x="720" y="560" width="10" height="64" rx="5" fill="#bdcce3"/>
    <rect class="bar" style="animation-delay:.45s"  x="744" y="560" width="10" height="64" rx="5" />
    <rect class="bar" style="animation-delay:.3s"   x="768" y="560" width="10" height="64" rx="5" fill="#e6decc"/>
    <rect class="bar" style="animation-delay:.15s"  x="792" y="560" width="10" height="64" rx="5" />
  </g>
  <text x="640" y="664" fill="#8a93a3" font-size="13" text-anchor="middle" letter-spacing="3">ELEVENLABS VOICE · WHISPER SUBS · SHOT PLAN BY CLAUDE</text>
</svg>
