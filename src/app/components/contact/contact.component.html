<section id="contacto" scrub class="contact relative px-6 md:px-16 lg:px-24 w-full py-40 overflow-hidden">

  <!-- Keynote horizon: light line with bloom announcing the finale -->
  <div class="glow-horizon absolute top-0 left-0 right-0" aria-hidden="true"></div>

  <div class="relative max-w-6xl mx-auto">
    <div [reveal]="'up'" class="section-label flex items-center gap-3 mb-10 justify-center">
      <span class="line"></span>
      <span class="font-mono text-xs tracking-[0.3em] uppercase text-white/50">{{ t().contact.kicker }}</span>
      <span class="line line-r"></span>
    </div>

    <!-- Giant finale title — gradient pans with scroll -->
    <h2 [reveal]="'up'" [revealDelay]="60"
        class="finale-title font-display font-semibold text-center tracking-tight mb-8">
      {{ t().contact.finaleTitle }}
    </h2>

    <p [reveal]="'up'" [revealDelay]="120"
       class="text-white/65 text-lg md:text-xl leading-relaxed text-center max-w-xl mx-auto mb-16">
      {{ t().contact.subtitle }}
    </p>

    <form [reveal]="'up'" [revealDelay]="180"
          action="https://formspree.io/f/mkovawav" method="POST"
          class="glass-medium rounded-3xl p-6 md:p-10 space-y-5 max-w-2xl mx-auto">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="field">
          <input type="text" id="name" name="name" required placeholder=" "
                 class="field-input glass-subtle"/>
          <label for="name" class="field-label">{{ t().contact.name }}</label>
        </div>

        <div class="field">
          <input type="email" id="email" name="email" required placeholder=" "
                 class="field-input glass-subtle"/>
          <label for="email" class="field-label">{{ t().contact.email }}</label>
        </div>
      </div>

      <div class="field">
        <textarea id="message" name="message" rows="6" required placeholder=" "
                  class="field-input glass-subtle resize-none"></textarea>
        <label for="message" class="field-label">{{ t().contact.message }}</label>
      </div>

      <div class="flex justify-end pt-3">
        <button magnetic type="submit"
                class="submit-btn glass-strong sheen group relative inline-flex items-center gap-3
                       px-8 py-4 rounded-full font-mono text-sm tracking-wide text-white overflow-hidden">
          <span class="relative z-10">{{ t().contact.send }}</span>
          <svg class="w-4 h-4 relative z-10 transition-transform group-hover:translate-x-1"
               fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
          <span class="submit-glow" aria-hidden="true"></span>
        </button>
      </div>
    </form>
  </div>
</section>
