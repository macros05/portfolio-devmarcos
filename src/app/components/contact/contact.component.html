<section id="contact" class="contact" data-chapter="6">
  <div class="inner">
    <header [reveal]="'up'">
      <p class="kicker">{{ t().contact.kicker }}</p>
      <h2>{{ t().contact.finaleTitle }}</h2>
      <p class="lede">{{ t().contact.subtitle }}</p>
    </header>

    <form
      [reveal]="'up'"
      [revealDelay]="80"
      (submit)="onSubmit($event)"
      novalidate
      [attr.aria-label]="t().contact.title">

      <div class="field">
        <label for="name">{{ t().contact.name }}</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          autocomplete="name"
          [placeholder]="t().contact.placeholderName" />
      </div>

      <div class="field">
        <label for="email">{{ t().contact.email }}</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="email"
          [placeholder]="t().contact.placeholderEmail" />
      </div>

      <div class="field">
        <label for="message">{{ t().contact.message }}</label>
        <textarea
          id="message"
          name="message"
          rows="5"
          required
          [placeholder]="t().contact.placeholderMessage"></textarea>
      </div>

      @if (status() === 'sending') {
        <p class="status" role="status">{{ t().contact.sending }}</p>
      }
      @if (status() === 'success') {
        <p class="status is-ok" role="status">{{ t().contact.success }}</p>
      }
      @if (status() === 'error') {
        <p class="status is-bad" role="alert">{{ t().contact.error }}</p>
      }

      <div class="actions">
        <button type="submit" [disabled]="status() === 'sending' || status() === 'success'">
          {{ t().contact.send }}
        </button>
        <a
          href="https://github.com/macros05"
          target="_blank"
          rel="noopener noreferrer">
          {{ t().footer.viewSource }}
        </a>
      </div>
    </form>
  </div>
</section>
