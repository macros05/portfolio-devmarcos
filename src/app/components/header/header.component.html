<header class="bar">
  <a routerLink="/" class="mark" (click)="closeMenu()">Marcos Morales</a>

  <nav class="desk" [attr.aria-label]="t().nav.menu">
    @for (link of links; track link.fragment) {
      <a
        routerLink="/"
        [fragment]="link.fragment"
        [attr.aria-current]="active() === link.fragment ? 'true' : null">
        {{ t().nav[link.label] }}
      </a>
    }
  </nav>

  <div class="tools">
    <button type="button" class="lang" (click)="toggleLang()" [attr.aria-label]="t().nav.lang">
      {{ lang.lang() === 'en' ? 'ES' : 'EN' }}
    </button>
    <button
      type="button"
      class="burger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? t().nav.close : t().nav.menu">
      <span></span><span></span>
    </button>
  </div>
</header>

@if (menuOpen()) {
  <nav class="sheet" [attr.aria-label]="t().nav.menu">
    @for (link of links; track link.fragment) {
      <a routerLink="/" [fragment]="link.fragment" (click)="closeMenu()">
        {{ t().nav[link.label] }}
      </a>
    }
  </nav>
}
