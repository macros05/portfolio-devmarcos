<section class="hero" (pointermove)="onPointer($event)">
  <div class="inner">
    <div class="mast">
      <div>
        <p class="eyebrow" [reveal]="'fade'">{{ t().hero.open }}</p>
        <h1 class="name" [reveal]="'up'" [revealDelay]="40">Marcos<br>Morales</h1>
      </div>
      <div class="plate" aria-hidden="true">
        <canvas #field class="field" [class.is-off]="!showField()"></canvas>
      </div>
    </div>

    <p class="position" [reveal]="'up'" [revealDelay]="90">
      {{ t().hero.positioning }}
      <em>{{ t().hero.positioningEm }}</em>
    </p>

    <p class="support" [reveal]="'up'" [revealDelay]="130">
      {{ t().hero.support }}
    </p>

    <div class="reel" [reveal]="'up'" [revealDelay]="170">
      <app-media-slot
        [src]="reel.src"
        [poster]="reel.poster"
        [label]="caption()"
        [width]="reel.width"
        [height]="reel.height"
        [autoplay]="true"
        [playLabel]="t().hero.play"
        [pauseLabel]="t().hero.pause">
      </app-media-slot>
      <p class="caption">{{ caption() }}</p>
    </div>
  </div>
</section>
