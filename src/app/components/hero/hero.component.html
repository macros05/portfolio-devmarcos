<section class="hero" (pointermove)="onPointer($event)">
  <div class="glow" aria-hidden="true"></div>

  <canvas #field class="field" [class.is-off]="!showField()" aria-hidden="true"></canvas>

  <div class="inner">
    <p class="eyebrow" [reveal]="'fade'">
      <span class="name">Marcos Morales</span>
      <span class="dot" aria-hidden="true"></span>
      <span>{{ t().hero.open }}</span>
    </p>

    <h1 class="line" [reveal]="'up'" [revealDelay]="70">
      {{ t().hero.positioning }}
      <em>{{ t().hero.positioningEm }}</em>
    </h1>

    <p class="support" [reveal]="'up'" [revealDelay]="140">
      {{ t().hero.support }}
    </p>

    <div class="reel" [reveal]="'up'" [revealDelay]="200">
      <app-media-slot
        [src]="reel.src"
        [poster]="reel.poster"
        [label]="caption()"
        [width]="reel.width"
        [height]="reel.height"
        [autoplay]="true"
        [playLabel]="t().hero.play"
        [pauseLabel]="t().hero.pause">
      </app-media-slot>
      <p class="caption">{{ caption() }}</p>
    </div>
  </div>
</section>
